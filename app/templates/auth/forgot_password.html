<!doctype html>
{% extends "layouts/public.html" %}
{% block content %}
<a class="back" href="{{ url_for('auth.role_chooser') }}">‹ All sign-in options</a>
<section class="card auth-card">
  <h1>Forgot password?</h1>
  {% if sent %}
    <div class="banner info">If an account matches, a reset link has been sent.</div>
  {% else %}
    <form method="post">
      {{ form.hidden_tag() }}
      <label for="identifier">Matric number or email</label>
      {{ form.identifier() }}
      <button class="btn primary" type="submit">Send reset link</button>
    </form>
  {% endif %}
  <p class="muted">Or ask your coordinator to send you a new link.</p>
</section>
{% endblock %}
