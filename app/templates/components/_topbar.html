<!doctype html>
<header class="topbar">
  <a class="brand" href="{{ url_for('auth.role_chooser') }}">
    <span class="logo" aria-hidden="true">▯</span>
    <span><strong>SIWES</strong><br><small>Logbook</small></span>
  </a>
  <div class="topbar-right">
    <button id="net-state" class="icon-btn net on" type="button" title="Online" aria-label="Connection status: online">⬤</button>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme">◐</button>
    <details class="user-menu">
      <summary>
        <span class="who"><strong>{{ current_user.full_name }}</strong>
          <span class="role-badge {{ current_user.role }}">{{ current_user.role_label }}</span></span>
        <span class="avatar">{{ initials(current_user.full_name) }}</span>
      </summary>
      <div class="menu">
        <p class="menu-name">{{ current_user.full_name }}</p>
        <span class="role-badge {{ current_user.role }}">{{ current_user.role_label }}</span>
        <button type="button" class="install-app" hidden>Install app</button>
        <hr>
        <form method="post" action="{{ url_for('auth.sign_out') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Sign out</button>
        </form>
      </div>
    </details>
  </div>
</header>
