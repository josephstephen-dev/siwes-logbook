<!doctype html>
{% from "components/_field.html" import field %}
{% macro password_fields(form) %}
<div class="field">
  <label for="password">Password</label>
  <div class="pw-wrap">
    {{ form.password(autocomplete="new-password") }}
    <button type="button" class="pw-toggle" data-toggle="password">Show</button>
  </div>
  <div class="strength" aria-hidden="true"><span id="strength-bar"></span></div>
  <p class="small muted" id="strength-label">Strength: –</p>
  <ul class="rules" id="rules">
    <li data-rule="len">At least 10 characters</li>
    <li data-rule="letter">At least one letter</li>
    <li data-rule="num">At least one number</li>
  </ul>
</div>
{{ field(form.confirm, autocomplete="new-password") }}
{% endmacro %}
