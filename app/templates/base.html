<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title_full %}{% block title %}{{ app_name }}{% endblock %} | {{ app_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Digital SIWES industrial training logbook for Nigerian university students, industry supervisors and coordinators. Write daily entries, get weekly approval and issue a verifiable logbook.{% endblock %}">
  <meta name="theme-color" content="#1b5e44">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ app_name }}">
  <meta property="og:title" content="{{ app_name }}">
  <meta property="og:description" content="{{ self.description() }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/paper.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/polish.css') }}">
  <link rel="manifest" href="{{ url_for('meta.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-192.png') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/copy.js') }}"></script>
  <script src="{{ url_for('static', filename='js/connectivity.js') }}"></script>
  <script src="{{ url_for('static', filename='js/draft_autosave.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
